name: abdm_hims
description: "MediFlux Hospital Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Material 3 & UI
  google_fonts: ^6.1.0
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0

  # State Management - Riverpod
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Supabase Backend
  supabase_flutter: ^2.3.0

  # Networking
  dio: ^5.4.0
  http: ^1.2.0
  connectivity_plus: ^5.0.2

  # Models & Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  equatable: ^2.0.5

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0

  # Device Features
  image_picker: ^1.0.7
  permission_handler: ^11.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

  # Utilities
  intl: ^0.19.0
  logger: ^2.0.2+1
  crypto: ^3.0.3
  path_provider: ^2.1.1
  archive: ^4.0.9
  
  # PDF Generation & Printing
  pdf: ^3.10.7
  printing: ^5.11.1
  
  url_launcher: ^6.2.2
  package_info_plus: ^10.2.1

  # Reports Module — sharing files/text via WhatsApp, Gmail & any app
  share_plus: ^13.3.0
  open_file: ^3.3.2

  # Charts & Analytics
  fl_chart: ^0.66.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  file_selector: ^1.1.0
  camera: ^0.12.0+2
  video_player: ^2.14.0
  record: ^5.1.2
  audioplayers: ^6.8.1
  signature: ^6.4.0
  # Optional: Firebase Auth — Firebase login token verify karne ke liye.
  # Jab zaroorat ho toh comment hata kar `flutter pub get` chalao.
  # firebase_auth: ^4.17.8

# ---------------------------------------------------------------------------
# Dependency overrides
# ---------------------------------------------------------------------------
# `record 5.1.2` + `record_web 1.0.5` abhi tak record_platform_interface 1.5+
# ke naye `hasPermission(..., {bool request})` signature ke saath compatible
# nahi hain. 1.4.0 par pin karne se web builds theek ho jaati hain (record 7.x
# is blocked by package_info_plus 5.x's `web` constraint).
#
# `record_linux 0.7.2` interface 1.4.0 ka `startStream` implement nahi karta,
# isliye Flutter ka generated dart_plugin_registrant (sabhi platforms ke Dart
# plugins compile karta hai) Windows/Web builds fail kar deta hai.
# `record_linux 1.2.1` interface ^1.4.0 ke saath compatible hai.
dependency_overrides:
  record_platform_interface: 1.4.0
  record_linux: 1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  mocktail: ^1.0.1
  drift_dev: ^2.15.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/config/
    - assets/fonts/
    - assets/branding/
    - assets/web/