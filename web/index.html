<!DOCTYPE html>
<html>
<head>
  <!--
    Vercel deployment serves the app from the domain root, so the base href
    must be "/". The build script in package.json passes `--base-href /`,
    which makes `flutter build web` replace the `$FLUTTER_BASE_HREF`
    placeholder below with "/" at build time.

    Keep this placeholder instead of hard-coding "/" so the same index.html
    also works for sub-path deployments (e.g. preview aliases or if the app is
    ever mounted under a project sub-directory).

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MediFlux Hospital Software — ABDM-compliant Hospital Information Management System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MediFlux">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MediFlux Hospital Software</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Runtime environment configuration for Vercel deployments.

    `web/env.js` is generated by the Vercel build script (package.json →
    vercel-build) from the project environment variables (SUPABASE_URL,
    SUPABASE_ANON_KEY, DEEPSEEK_API_KEY). The committed env.js is an empty
    template, so local builds fall through to the --dart-define values and
    local-development constants inside lib/config/supabase_web_config.dart.

    It MUST load before flutter_bootstrap.js so the values are already on
    window._env_ when the Dart code starts.
  -->
  <script>
    window._env_ = window._env_ || {};
  </script>
  <script src="env.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
